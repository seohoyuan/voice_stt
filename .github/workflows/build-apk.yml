name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      bundle_stt:
        description: "Bundle whisper.cpp STT engine and ggml-small-q5_1 model"
        required: false
        default: "false"
  push:
    branches:
      - main
      - master
    paths:
      - "main.py"
      - "voice2spec/**"
      - "tools/**"
      - "buildozer.spec"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            cmake \
            git \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            libtool \
            openjdk-17-jdk \
            pkg-config \
            python3-dev \
            unzip \
            zip \
            zlib1g-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython<3.0" buildozer

      - name: Cache Buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Run unit tests
        run: |
          python tools/check_mobile_project.py
          python -m unittest discover -s tests

      - name: Prepare Korean font
        run: |
          mkdir -p assets/fonts
          curl -L --retry 3 \
            -o assets/fonts/NotoSansCJKkr-Regular.otf \
            https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Korean/NotoSansCJKkr-Regular.otf
          test -s assets/fonts/NotoSansCJKkr-Regular.otf

      - name: Prepare whisper.cpp STT
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_stt == 'true' }}
        run: bash tools/prepare_whisper_android.sh

      - name: Build APK
        run: yes | buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice2spec-debug-apk
          path: bin/*.apk
          if-no-files-found: error
